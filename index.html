<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Location Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="dateButtonsContainer" class="date-buttons-container"></div>
    <div id="map"></div>
    <!-- ▼ 시간 슬라이더 컨테이너 -->
    <div id="timeSliderContainer" class="time-slider-container">
        <label class="toggle-switch">
            <input type="checkbox" id="timeSliderToggle">
            <span class="toggle-slider"></span>
        </label>
        <label>Time Filter: <span id="timeLabel"></span></label>
        <input type="range" id="timeSlider" min="0" max="1439" value="0" list="timeTicks" disabled />
        <datalist id="timeTicks"></datalist>
    </div>

    <!-- ▼ 위치정보 없는 사진 갤러리 버튼 -->
    <div id="noGpsGalleryContainer" class="date-buttons-container">
        <button id="noGpsGalleryButton" class="date-button">Photos without GPS</button>
    </div>

    <!-- ▼ 위치정보 없는 사진 갤러리 모달 -->
    <div id="noGpsGalleryModal" class="noGpsGallery-modal" style="display: none;">
      <div class="noGpsGallery-content">
          <span class="close-button">&times;</span>
          <!-- ▼ 이미지 그리드 -->
          <div class="noGpsGallery-image-grid">
              <!-- 위치정보 없는 갤러리 이미지들이 여기 들어갑니다 -->
          </div>
          <!-- ▼ Pagination Controls -->
          <div class="noGpsGallery-pagination">
              <button class="pagination-prev" onclick="PhotoMapApp.noGpsGalleryPrevPage()">❮ Prev</button>
              <span class="pagination-info">Page <span id="currentPage">1</span> of <span id="totalPages">10</span></span>
              <button class="pagination-next" onclick="PhotoMapApp.noGpsGalleryNextPage()">Next ❯</button>
          </div>
      </div>
    </div>

    <!-- jQuery 먼저 로드 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- index.js 먼저 로드 -->
    <script src="index.js"></script>
    <!-- Google Maps JavaScript API 로드 및 콜백 설정 -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC0IKm6jPWKcOptPSlInsw7zk_xsXMLdD8&callback=PhotoMapApp.createMap">
    </script>
    <!-- MarkerClusterer library -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <!-- EXIF library -->
    <script src="https://unpkg.com/exif-js"></script>
</body>
</html>
